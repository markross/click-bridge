[package]
name = "click-bridge"
version = "0.1.0"
edition = "2024"
description = "Use a Zwift Click v2 controller to shift gears in MyWhoosh"
license = "MIT"

[dependencies]
anyhow = "1"
btleplug = "0.13"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
uuid = "1"
